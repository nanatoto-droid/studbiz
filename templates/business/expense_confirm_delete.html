{% extends "base.html" %}
{% block title %}Delete expense{% endblock %}
{% block content %}
<div class="card">
    <h1>Delete expense?</h1>
    <p>Are you sure you want to delete <strong>{{ expense.description }}</strong> (KES {{ expense.amount }})?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a class="btn btn-secondary" href="{% url 'business:expense_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
