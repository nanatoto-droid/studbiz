{% extends "base.html" %}
{% block title %}Record expense{% endblock %}
{% block content %}
<div class="card">
    <h1>Record an expense</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <p>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<span class="message error">{{ field.errors|striptags }}</span>{% endif %}
            </p>
        {% endfor %}
        <button type="submit">Save expense</button>
        <a class="btn btn-secondary" href="{% url 'business:expense_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
