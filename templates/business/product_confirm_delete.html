{% extends "base.html" %}
{% block title %}Delete product{% endblock %}
{% block content %}
<div class="card">
    <h1>Delete product?</h1>
    <p>Are you sure you want to delete <strong>{{ product.name }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a class="btn btn-secondary" href="{% url 'business:product_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
