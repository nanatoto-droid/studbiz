{% extends "base.html" %}
{% block title %}Send request{% endblock %}
{% block content %}
<div class="card">
    <h1>Send partnership request to {{ target.name }}</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <p>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<span class="message error">{{ field.errors|striptags }}</span>{% endif %}
            </p>
        {% endfor %}
        <button type="submit">Send request</button>
        <a class="btn btn-secondary" href="{% url 'network:directory_detail' target.id %}">Cancel</a>
    </form>
</div>
{% endblock %}
